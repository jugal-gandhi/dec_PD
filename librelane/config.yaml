# GF180MCU chip: posit<32,2> decoder with an 88-pad I/O ring.
# Based on the wafer.space gf180mcu-project-template (Apache-2.0).
# Pad lists live in pads.yaml (generated by scripts/gen_chip_top.py).
meta:
  version: 3
  flow: Chip
  substituting_steps:
    # Render the layout after seal-ring insertion
    KLayout.Render: null
    +KLayout.SealRing: KLayout.Render

DESIGN_NAME: chip_top
VERILOG_FILES:
- dir::../src/chip_top.v
- dir::../src/posit_decoder_32_2.v

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Timing: combinational, virtual clock (see chip_top.sdc)
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc
CLOCK_PERIOD: 50

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# Output-only use of bi_24t leaves Y open; die-art macros have no pins
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- dieart_tl
- dieart_tr
- dieart_bl
- dieart_br

# Floorplan: 2987 um square die, 22 pads per side on a 100 um pitch.
# The die is pad-limited, so a compact 600 um core sits in the centre and the
# pad routes and power straps cross the open area between ring and core.
FP_SIZING: absolute
DIE_AREA: [0, 0, 2987, 2987]
CORE_AREA: [1193.5, 1193.5, 1793.5, 1793.5]

# Repair slew with extra margin so the slow corners also stay within limits
DESIGN_REPAIR_MAX_SLEW_PCT: 40
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 35

# Placement
PL_TARGET_DENSITY_PCT: 18
PL_MAX_DISPLACEMENT_Y: 200
GRT_ALLOW_CONGESTION: true

# Fix antenna violations after detailed routing
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %

# PDN
PDN_CFG: dir::pdn/pdn_cfg.tcl
PDN_ENABLE_PINS: False
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_CORE_RING: True
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_CORE_VERTICAL_LAYER: Metal4
PDN_CORE_HORIZONTAL_LAYER: Metal3
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [Metal2]

# Report magic DRC but do not stop on it (KLayout DRC is the sign-off deck)
ERROR_ON_MAGIC_DRC: False

# Prevent false-positive DRC errors inside the foundry I/O cells
MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "G_ring_*"

# Metal2 cannot meet minimum density next to active metal
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true

# Several supply pads per power domain
MAGIC_EXT_UNIQUE: notopports

# Flow render
KLAYOUT_RENDER_RESOLUTION: 2048
KLAYOUT_RENDER_OVERSAMPLING: 3
KLAYOUT_PROPERTIES: dir::gf180mcu_render.lyp

# DRC
KLAYOUT_DRC_THREADS: 1
KLAYOUT_DRC_OPTIONS:
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max
KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max
KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max

# Die-art badges in the four corners (outside the core, inside the seal ring)
MACROS:
  dieart_tl:
    gds: [dir::../ip/dieart/gds/dieart_tl.gds]
    lef: [dir::../ip/dieart/lef/dieart_tl.lef]
    vh: [dir::../ip/dieart/vh/dieart_tl.v]
    lib:
      "*": [dir::../ip/dieart/lib/dieart_tl.lib]
    instances:
      art_tl:
        location: [26, 2817.75]
        orientation: N
  dieart_tr:
    gds: [dir::../ip/dieart/gds/dieart_tr.gds]
    lef: [dir::../ip/dieart/lef/dieart_tr.lef]
    vh: [dir::../ip/dieart/vh/dieart_tr.v]
    lib:
      "*": [dir::../ip/dieart/lib/dieart_tr.lib]
    instances:
      art_tr:
        location: [2817.75, 2817.75]
        orientation: N
  dieart_bl:
    gds: [dir::../ip/dieart/gds/dieart_bl.gds]
    lef: [dir::../ip/dieart/lef/dieart_bl.lef]
    vh: [dir::../ip/dieart/vh/dieart_bl.v]
    lib:
      "*": [dir::../ip/dieart/lib/dieart_bl.lib]
    instances:
      art_bl:
        location: [26, 26]
        orientation: N
  dieart_br:
    gds: [dir::../ip/dieart/gds/dieart_br.gds]
    lef: [dir::../ip/dieart/lef/dieart_br.lef]
    vh: [dir::../ip/dieart/vh/dieart_br.v]
    lib:
      "*": [dir::../ip/dieart/lib/dieart_br.lib]
    instances:
      art_br:
        location: [2817.75, 26]
        orientation: N
