name: Layout

on:
  push:
    branches:
      - layout
  workflow_dispatch:

concurrency:
  group: layout-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  macros3:
    name: "v3 macro: ${{ matrix.macro }}"
    if: "!contains(github.event.head_commit.message, '[pvt-only]') && !contains(github.event.head_commit.message, '[cmp-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        macro: [cpu_core, dsp_mac, simd_alu, spimemio, simpleuart, posit_decoder_32_2]
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Fetch GF180MCU PDK
        run: nix develop --command make clone-pdk
      - name: Reuse a macro hardened from the same sources
        id: cache
        uses: actions/cache@v4
        with:
          path: ip/v3/macros/${{ matrix.macro }}
          key: macro3-${{ matrix.macro }}-${{ hashFiles('src/v3/cpu_core.v', 'src/v3/dsp_mac.v', 'src/v3/simd_alu.v', 'src/soc/vendor/**', 'src/posit_decoder_32_2.v', format('librelane/v3/macros/{0}/**', matrix.macro), 'scripts/export_macro3.sh', 'flake.lock') }}
      - name: Harden macro
        id: flow
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop --command make macro3-${{ matrix.macro }} 2>&1 | tee flow_console_${{ matrix.macro }}.log
      - name: Upload macro views
        if: steps.flow.outcome == 'success' || steps.cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macro3-${{ matrix.macro }}
          path: ip/v3/macros/${{ matrix.macro }}
          retention-days: 7
      - name: Render macro layer masks
        if: steps.flow.outcome == 'success'
        continue-on-error: true
        run: nix develop --command python3 scripts/render_masks.py ip/v3/macros/${{ matrix.macro }}/gds/${{ matrix.macro }}.gds results/m3_${{ matrix.macro }}/masks --pdk gf180
      - name: Collect and publish macro reports
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/collect_macro3.sh ${{ matrix.macro }} "${{ steps.flow.outcome }}"
          bash scripts/publish_results.sh m3_${{ matrix.macro }} results-v3m-${{ matrix.macro }}

  sim3:
    name: v3 firmware and chip-level simulation
    if: "!contains(github.event.head_commit.message, '[pvt-only]') && !contains(github.event.head_commit.message, '[cmp-only]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V GCC
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-riscv64-unknown-elf
      - name: Build firmware
        id: fw
        continue-on-error: true
        run: bash firmware/v3/build.sh 2>&1 | tee firmware_build.log
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Fetch GF180MCU PDK
        run: nix develop --command make clone-pdk
      - name: Chip-level SoC simulation
        id: sim
        continue-on-error: true
        run: nix develop --command make soc3-sim 2>&1 | tail -n 400 | tee soc_sim_console.log
      - name: Lint top level with Yosys
        id: lint
        continue-on-error: true
        run: |
          nix develop --command yosys -q -p "read_verilog -sv -DUSE_POWER_PINS ip/v3/vh/*.v ip/posit_macro/vh/posit_decoder_32_2.v ip/dieart/vh/*.v pdk/gf180mcuD/libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram512x8m8wm1__blackbox_pp.v; read_verilog -sv src/v3/soc3_top.v src/soc/soc_sram_2kb.v; hierarchy -top soc3_top; proc; check; stat" 2>&1 | tee lint3.log
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p results/v3sim
          cp -f firmware_build.log soc_sim_console.log lint3.log firmware/v3/firmware.hex verif/v3/out/*.log results/v3sim/ 2>/dev/null || true
          echo '{"firmware": "${{ steps.fw.outcome }}", "sim": "${{ steps.sim.outcome }}", "lint": "${{ steps.lint.outcome }}", "commit": "${{ github.sha }}"}' > results/v3sim/status.json
          bash scripts/publish_results.sh v3sim results-v3sim

  pvt3:
    name: Posit decoder PVT sweep (OpenSTA)
    if: contains(github.event.head_commit.message, '[pvt-only]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Fetch GF180MCU PDK
        run: nix develop --command make clone-pdk
      - name: Restore the signed-off posit macro
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ip/v3/macros/posit_decoder_32_2
          key: macro3-posit_decoder_32_2-${{ hashFiles('src/v3/cpu_core.v', 'src/v3/dsp_mac.v', 'src/v3/simd_alu.v', 'src/soc/vendor/**', 'src/posit_decoder_32_2.v', 'librelane/v3/macros/posit_decoder_32_2/**', 'scripts/export_macro3.sh', 'flake.lock') }}
      - name: Harden the macro if the cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop --command make macro3-posit_decoder_32_2 2>&1 | tail -n 200
      - name: PVT sweep
        run: |
          nix develop --command bash scripts/pvt_sweep.sh ip/v3/macros/posit_decoder_32_2 results/pvt3 2>&1 | tee pvt_console.log
          cp pvt_console.log results/pvt3/
          cp ip/v3/macros/posit_decoder_32_2/metrics.json results/pvt3/ 2>/dev/null || true
          echo '{"cache_hit": "${{ steps.cache.outputs.cache-hit }}", "commit": "${{ github.sha }}"}' > results/pvt3/status.json
      - name: Publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_results.sh pvt3 results-pvt3

  cmp3:
    name: "Comparison decoder: ${{ matrix.design }}"
    if: contains(github.event.head_commit.message, '[cmp-only]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        design: [ldd_32_2, percival_32_2]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Fetch GF180MCU PDK
        run: nix develop --command make clone-pdk
      - name: Prepare sources
        run: bash scripts/cmp_prepare.sh ${{ matrix.design }}
      - name: Functional check against the reference model
        id: sim
        continue-on-error: true
        run: nix develop --command bash scripts/cmp_sim.sh ${{ matrix.design }} 2>&1 | tail -n 60 | tee cmp_sim.log
      - name: Harden
        id: flow
        run: nix develop --command make cmp3-${{ matrix.design }} 2>&1 | tail -n 300 | tee flow_console.log
      - name: Render layer masks
        continue-on-error: true
        run: nix develop --command python3 scripts/render_masks.py ip/v3/macros/${{ matrix.design }}/gds/${{ matrix.design }}.gds results/cmp_${{ matrix.design }}/masks --pdk gf180
      - name: PVT sweep
        continue-on-error: true
        run: nix develop --command bash scripts/pvt_sweep.sh ip/v3/macros/${{ matrix.design }} results/cmp_${{ matrix.design }}/pvt ${{ matrix.design }}
      - name: Collect and publish
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R=results/cmp_${{ matrix.design }}
          M=ip/v3/macros/${{ matrix.design }}
          mkdir -p $R
          cp -f cmp_sim.log flow_console.log $R/ 2>/dev/null || true
          cp -f build/ext/${{ matrix.design }}.changes.diff $R/ 2>/dev/null || true
          cp -rf build/ext/${{ matrix.design }} $R/src 2>/dev/null || true
          cp -f $M/metrics.json $R/ 2>/dev/null || true
          cp -f $M/lef/*.lef $R/ 2>/dev/null || true
          gzip -c $M/def/${{ matrix.design }}.def > $R/${{ matrix.design }}.def.gz 2>/dev/null || true
          gzip -c $M/nl/${{ matrix.design }}.nl.v > $R/${{ matrix.design }}.nl.v.gz 2>/dev/null || true
          echo '{"sim": "${{ steps.sim.outcome }}", "flow": "${{ steps.flow.outcome }}", "commit": "${{ github.sha }}"}' > $R/status.json
          bash scripts/publish_results.sh cmp_${{ matrix.design }} results-cmp-${{ matrix.design }}

  soc3:
    name: GF180MCU multi-block SoC (v3)
    needs: macros3
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v4
      - name: Download macro views
        uses: actions/download-artifact@v4
        with:
          pattern: macro3-*
          path: macro_artifacts
      - name: Place macro views
        run: |
          for d in macro_artifacts/macro3-*; do
            m=${d#macro_artifacts/macro3-}
            mkdir -p ip/v3/macros/$m && cp -r "$d"/. ip/v3/macros/$m/
          done
          find ip/v3/macros -maxdepth 3 -type d | sort
      - name: Install RISC-V GCC
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-riscv64-unknown-elf
      - name: Build firmware
        id: fw
        continue-on-error: true
        run: bash firmware/v3/build.sh 2>&1 | tee firmware_build.log
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Fetch GF180MCU PDK
        run: nix develop --command make clone-pdk
      - name: Implement the SoC chip
        id: flow
        continue-on-error: true
        run: nix develop --command make soc3 2>&1 | tee flow_console_soc3.log
      - name: Render layer masks
        if: always()
        continue-on-error: true
        run: |
          GDS=$(ls final_soc3/gds/soc3_chip_top.gds 2>/dev/null || ls -1 librelane/soc3/runs/*/*-klayout-filler/soc3_chip_top.gds 2>/dev/null | tail -n 1)
          if [ -n "$GDS" ]; then
            nix develop --command python3 scripts/render_masks.py "$GDS" results/soc3/masks --pdk gf180 \
              --die-px 6144 --extra-views librelane/soc3/render_views.json
          fi
      - name: Collect results
        if: always()
        run: |
          bash scripts/collect_results.sh soc3 "${{ steps.flow.outcome }}"
          echo '{"firmware": "${{ steps.fw.outcome }}", "flow": "${{ steps.flow.outcome }}"}' > results/soc3/stages.json
      - name: Publish results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_results.sh soc3 results-soc3

  soc:
    name: GF180MCU RISC-V SoC (hierarchical)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v4
      - name: Install RISC-V GCC
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-riscv64-unknown-elf
      - name: Build firmware
        id: fw
        continue-on-error: true
        run: bash firmware/build.sh 2>&1 | tee firmware_build.log
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Equivalence check (VHDL vs Verilog)
        id: equiv
        continue-on-error: true
        run: nix develop --command bash verif/equiv.sh 2>&1 | tee equiv_console.log
      - name: Fetch GF180MCU PDK
        run: nix develop --command make clone-pdk
      - name: Chip-level SoC simulation
        id: sim
        continue-on-error: true
        run: nix develop --command make soc-sim 2>&1 | tail -n 400 | tee soc_sim_console.log
      - name: "Stage 1: harden posit decoder macro"
        id: macro
        continue-on-error: true
        run: nix develop --command make macro 2>&1 | tee flow_console_macro.log
      - name: "Stage 2: implement the SoC chip"
        id: flow
        if: steps.macro.outcome == 'success'
        continue-on-error: true
        run: nix develop --command make soc 2>&1 | tee flow_console_soc.log
      - name: Render layer masks
        if: always()
        continue-on-error: true
        run: |
          GDS=$(ls final_soc/gds/soc_chip_top.gds 2>/dev/null || ls -1 librelane/soc/runs/*/*-klayout-filler/soc_chip_top.gds 2>/dev/null | tail -n 1)
          if [ -n "$GDS" ]; then
            nix develop --command python3 scripts/render_masks.py "$GDS" results/soc/masks --pdk gf180
          fi
      - name: Collect results
        if: always()
        run: |
          bash scripts/collect_results.sh soc "${{ steps.flow.outcome }}" "${{ steps.equiv.outcome }}"
          echo '{"firmware": "${{ steps.fw.outcome }}", "soc_sim": "${{ steps.sim.outcome }}", "macro": "${{ steps.macro.outcome }}"}' > results/soc/stages.json
      - name: Publish results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_results.sh soc results-soc

  gf180:
    name: GF180MCU decoder chip (v1, pad-limited)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Equivalence check (VHDL vs Verilog)
        id: equiv
        continue-on-error: true
        run: nix develop --command bash verif/equiv.sh 2>&1 | tee equiv_console.log
      - name: Fetch GF180MCU PDK
        run: nix develop --command make clone-pdk
      - name: Implement the chip
        id: flow
        continue-on-error: true
        run: nix develop --command make chip 2>&1 | tee flow_console_gf180.log
      - name: Render layer masks
        if: always()
        continue-on-error: true
        run: |
          GDS=$(ls final/gds/chip_top.gds 2>/dev/null || ls -1 librelane/runs/*/*-klayout-filler/chip_top.gds 2>/dev/null | tail -n 1)
          if [ -n "$GDS" ]; then
            nix develop --command python3 scripts/render_masks.py "$GDS" results/gf180/masks --pdk gf180
          fi
      - name: Collect results
        if: always()
        run: bash scripts/collect_results.sh gf180 "${{ steps.flow.outcome }}" "${{ steps.equiv.outcome }}"
      - name: Publish results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_results.sh gf180 results-gf180

  sky130:
    name: SKY130 core-only layout
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: ./.github/actions/setup_nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Nix shell
        uses: ./.github/actions/build_nix
        with:
          nix_system: x86_64-linux
      - name: Harden the core
        id: flow
        continue-on-error: true
        run: nix develop --command make sky130 2>&1 | tee flow_console_sky130.log
      - name: Render layer masks
        if: always()
        continue-on-error: true
        run: |
          GDS=$(ls final_sky130/gds/posit_decoder_32_2.gds 2>/dev/null || ls -1 librelane/sky130/runs/*/*-klayout-streamout/posit_decoder_32_2.gds 2>/dev/null | tail -n 1)
          if [ -n "$GDS" ]; then
            nix develop --command python3 scripts/render_masks.py "$GDS" results/sky130/masks --pdk sky130
          fi
      - name: Collect results
        if: always()
        run: bash scripts/collect_results.sh sky130 "${{ steps.flow.outcome }}"
      - name: Publish results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_results.sh sky130 results-sky130
